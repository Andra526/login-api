<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
<h1>Forgot Password</h1>
<p class="sub">Masukkan email Anda untuk menerima instruksi reset password.</p>
<form novalidate>
  <div class="msg" role="alert" hidden></div>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <button type="submit">Kirim</button>
</form>
<div class="links"><a href="/login">Kembali ke login</a></div>
</main>
<script src="/app.js"></script>
<script>

wireForm(document.querySelector('form'), async (v, box) => {
  const r = await api('/auth/forgot-password', { method: 'POST', body: v });
  showMessage(box, 'ok', r.message);
  // Mode development: server mengembalikan token karena email belum dikirim.
  if (r.resetToken) {
    const url = '/password-recovery?email=' + encodeURIComponent(v.email) + '&token=' + encodeURIComponent(r.resetToken);
    const a = document.createElement('a');
    a.href = url; a.textContent = 'Buka halaman reset password (mode development)';
    const wrap = document.createElement('div'); wrap.style.marginTop = '8px'; wrap.append(a);
    box.append(wrap);
  }
});
</script>
</body>
</html>
