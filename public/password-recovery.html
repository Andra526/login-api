<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Recovery</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
<h1>Password Recovery</h1>
<p class="sub">Buat password baru untuk akun Anda.</p>
<form novalidate>
  <div class="msg" role="alert" hidden></div>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="token">Token reset</label>
  <input id="token" name="token" autocomplete="off" required>
  <p class="hint">Terisi otomatis dari link di email.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <label for="passwordConfirm">Password Confirm</label>
  <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
  <button type="submit">Kirim</button>
</form>
<div class="links"><a href="/login">Kembali ke login</a></div>
</main>
<script src="/app.js"></script>
<script>

const p = new URLSearchParams(location.search);
document.getElementById('email').value = p.get('email') || '';
document.getElementById('token').value = p.get('token') || '';
wireForm(document.querySelector('form'), async (v) => {
  await api('/auth/password-recovery', { method: 'POST', body: v });
  store.clear();
  location.href = '/login?reset=1';
});
</script>
</body>
</html>
